        <h2 class="display display-sm">Getting here</h2>
        <p class="detail">
          Nearly everyone will be driving in, and the drive is part of the trip. From Boise,
          head east on I-84 and then US-20 across the high desert; from Salt Lake City or Twin
          Falls, follow US-93 north to Shoshone. Both roads deliver you to Highway 75, which
          turns north and climbs gently up the Wood River Valley through Bellevue and Hailey
          into Ketchum.
        </p>
        <p class="detail">
          The last hour is the best part. The sagebrush gives way to cottonwoods along the Big
          Wood River, the hills rise into real mountains, and Bald Mountain appears above town
          with the Pioneers and Boulders standing behind it. Ketchum itself is a small mountain
          town that still feels like one: a few blocks of galleries, bookstores, and good
          restaurants, aspens along the river path, and cool, clear August evenings that call
          for a sweater. Galena Lodge sits another half hour north, where the valley narrows
          toward Galena Summit and the meadows run wild with late-summer flowers. Come early,
          stay late, and bring hiking shoes.
